project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!archive/"

website:
  title: "Conservation Governance and Rural Livelihoods in Madagascar"
  repo-url: https://github.com/BETSAKA/Rural_obs_PAs
  repo-actions: [source, issue]
  navbar:
    left:
      - text: Analysis
        menu:
          - text: "1. Context"
            href: 01_context.qmd
          - text: "2. Data"
            href: 02_data.qmd
          - text: "3. Identification Strategy"
            href: 03_strategy.qmd
          - text: "4. Results"
            href: 04_results.qmd
          - text: "5. Extensions"
            href: 05_extensions.qmd
          - text: "6. Discussion"
            href: 06_discussion.qmd
      - text: Appendices
        menu:
          - text: "A. Data Pipeline"
            href: A1_data_pipeline.qmd
          - text: "B. Donor Pool Validity"
            href: A2_donor_validity.qmd
          - text: "C. Robustness Tests"
            href: A3_robustness.qmd
          - text: "D. Methodology"
            href: A4_methodology.qmd

    right:
      - icon: github
        href: https://github.com/BETSAKA/Rural_obs_PAs
  sidebar:
    style: floating
    contents:
      - index.qmd
      - section: "Analysis"
        contents:
          - 01_context.qmd
          - 02_data.qmd
          - 03_strategy.qmd
          - 04_results.qmd
          - 05_extensions.qmd
          - 06_discussion.qmd
      - section: "Appendices"
        contents:
          - A1_data_pipeline.qmd
          - A2_donor_validity.qmd
          - A3_robustness.qmd
          - A4_methodology.qmd


