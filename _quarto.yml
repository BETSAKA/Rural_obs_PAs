project:
  type: book
  output-dir: docs

book:
  title: "Conservation Governance and Rural Livelihoods in Madagascar"
  subtitle: "Long-Run Analysis of Rural Observatory Surveys (1995–2025)"
  author:
    - name: Veromanitra Ramizason
    - name: Bezaka Rivolala
    - name: Thierry Razanakoto
    - name: Holimalala Randriamanampisoa
    - name: Florent Bédécarrats
  date: today
  repo-url: https://github.com/BETSAKA/Rural_obs_PAs
  repo-actions: [source, issue]
  output-file: rural-obs-PAs
  chapters:
    - index.qmd
    - part: "Analysis"
      chapters:
        - 01_context.qmd
        - 02_data.qmd
        - 03_strategy.qmd
        - 04_results.qmd
        - 05_extensions.qmd
        - 06_discussion.qmd
    - references.qmd
  appendices:
    - A1_data_pipeline.qmd
    - A2_donor_validity.qmd
    - A3_robustness.qmd
    - A4_methodology.qmd

# -- Bilingual setup ----------------------------------------------------------
babelquarto:
  mainlanguage: en
  languages:
    - fr
  title-fr: >
    Gouvernance de la conservation et conditions de vie rurales à Madagascar
  description-fr: >
    Analyse de long terme des Observatoires Ruraux (1995–2025)

format:
  html:
    theme: cosmo
    code-fold: true
    toc: true
    number-sections: true
    fig-width: 8
    fig-height: 6
  typst:
    toc: true
    number-sections: true
    fig-width: 8
    fig-height: 5
    fig-format: png
    include-before-body:
      - text: |
          #v(2fr)
          #align(center)[
            #image("media/Photo_Marovoay_Veromanitra_Ramizason_01.jpeg", width: 80%)
            #v(0.5em)
            #text(size: 9pt, style: "italic")[
              Marovoay observatory site near Ankarafantsika National Park. \
              Photo: Véromanitra Ramizason.
            ]
          ]
          #v(1fr)
          #pagebreak()
  docx:
    toc: true
    number-sections: true
    fig-width: 8
    fig-height: 6

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

bibliography: references.bib

